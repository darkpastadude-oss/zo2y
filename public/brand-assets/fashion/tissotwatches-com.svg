<svg xmlns="http://www.w3.org/2000/svg" width="172" height="22" viewBox="0 0 172 22" data-cbt="{&quot;event&quot;:&quot;homepageCTA&quot;,&quot;eventTypes&quot;:&quot;link, click&quot;,&quot;W-cat&quot;:&quot;Navigation&quot;,&quot;W-act&quot;:&quot;homepageCTA&quot;,&quot;W-lib&quot;:&quot;Tissot Startseite&quot;}">
	<style data-cbt="{&quot;event&quot;:&quot;homepageCTA&quot;,&quot;eventTypes&quot;:&quot;link, click&quot;,&quot;W-cat&quot;:&quot;Navigation&quot;,&quot;W-act&quot;:&quot;homepageCTA&quot;,&quot;W-lib&quot;:&quot;Tissot Startseite&quot;}">
		.logo-invert{
			fill: #0f0f0f;
		}
		.bl { fill: #0f0f0f; }
		.gr { fill: #0f0f0f; }

		.original_o {
			animation: o-fade 12s cubic-bezier(0.55, 0, 0.1, 1) infinite;
			transform-origin: 138.058px 11.209px;
		}

		.blade {
			transform-box: view-box;
			transform-origin: 138.058px 11.209px;
			animation: shutter 12s cubic-bezier(0.55, 0, 0.1, 1) infinite;
		}

		@keyframes o-fade {
			0% { opacity: 1;}
			2% { opacity: 1; transform: scaleX(1);}
			6% { opacity: 0; transform: scaleX(0.5); }
			7% { opacity: 0; transform: scaleX(.9); }
			18% { opacity: 1; transform: scaleX(1); }
			100% { opacity: 1; }
		}

		@keyframes shutter {
			0%, 2% { transform: rotate(calc(var(--i) * 60deg)) translateY(-11px); }
			6%, 7% { transform: rotate(calc(var(--i) * 60deg)) translateY(-2px); }
			18%, 100% { transform: rotate(calc(var(--i) * 60deg)) translateY(-16px); }
		}
	</style>

