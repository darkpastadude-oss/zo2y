<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Zo2y Auth Isolation Test</title>
  <meta name="theme-color" content="#0b1633">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #0a1024;
      color: #e6ecff;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 13px;
      padding: 16px;
      line-height: 1.5;
    }
    h1 { font-size: 16px; color: #ffb23f; margin: 0 0 4px; }
    .sub { color: #8ea3cd; font-size: 11px; margin-bottom: 14px; }
    .card {
      background: #121a38;
      border: 1px solid #22305c;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .card h2 { font-size: 12px; color: #9db2dc; margin: 0 0 8px; text-transform: uppercase; letter-spacing: .05em; }
    .row { display: flex; gap: 8px; align-items: baseline; padding: 2px 0; }
    .row .k { color: #5a6d9e; min-width: 160px; flex: 0 0 auto; }
    .row .v { color: #e6ecff; word-break: break-all; }
    .ok { color: #5ce08a; }
    .warn { color: #ffd166; }
    .bad { color: #ff6b6b; }
    .muted { color: #5a6d9e; }
    button {
      background: #16244d;
      color: #dbe6ff;
      border: 1px solid #31406f;
      border-radius: 6px;
      font: inherit;
      font-size: 12px;
      padding: 7px 12px;
      margin-right: 6px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    button:active { background: #23376b; }
    #log { max-height: 40vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .logline { padding: 2px 0; border-bottom: 1px solid #131c3a; font-size: 11px; }
    .logline .t { color: #ffb23f; }
    .logline .l { color: #8ea3cd; }
    .big-status { font-size: 15px; font-weight: 700; }
    details { margin-top: 4px; }
    summary { color: #9db2dc; cursor: pointer; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Zo2y Auth Isolation Test</h1>
  <div class="sub">Direct Supabase session restore — no auth-gate, no header, no homepage. Same storage bridge + storageKey as the app.</div>

  <div class="card">
    <h2>Storage (localStorage keys found)</h2>
    <div id="storageKeys"><span class="muted">checking…</span></div>
  </div>

  <div class="card">
    <h2>Session restore</h2>
    <div id="restoreStatus" class="big-status muted">waiting…</div>
    <div id="restoreDetails"></div>
  </div>

  <div class="card">
    <h2>onAuthStateChange</h2>
    <div id="authEvents"><span class="muted">none yet</span></div>
  </div>

  <div class="card">
    <h2>Live trace</h2>
    <button type="button" data-act="run">Run getSession() again</button>
    <button type="button" data-act="storage">Re-scan storage</button>
    <div id="log"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.107.0?v=20260708a" integrity="sha256-xS2zCnmQbdfvibZhfnqeZdQZq821LRYJlAfLw6FZpF0=" crossorigin="anonymous" defer></script>
  <script>
  (function () {
    'use strict';
    var SUPABASE_URL = 'https://gfkhjbztayjyojsgdpgk.supabase.co';
    var SUPABASE_KEY = 'sb_publishable_Rw-VlOLSWfzsycF4JMFUvg_vNlaMwVd';
    var STORAGE_KEY = 'zo2y-auth-v2';
    var PERSIST_KEY = 'zo2y-auth-persist-v2';
    var DURABLE_KEY = 'zo2y-auth-durable-v2';
    var LEGACY_KEY = 'zo2y-auth-v1';
    var SDK_KEY = 'sb-gfkhjbztayjyojsgdpgk-auth-token';

    var start = performance.now();
    var logs = [];
    function log(msg, cls) {
      var t = (performance.now() - start).toFixed(1);
      var line = document.createElement('div');
      line.className = 'logline';
      line.innerHTML = '<span class="t">+' + t + 'ms</span> <span class="l">' + String(msg).replace(/</g, '&lt;') + '</span>';
      var box = document.getElementById('log');
      box.appendChild(line);
      logs.push(msg);
      box.scrollTop = box.scrollHeight;
      var _ = cls;
    }

    function safeGet(key) {
      try { return window.localStorage.getItem(key); } catch (_e) { return null; }
    }
    function safeSet(key, val) {
      try { window.localStorage.setItem(key, val); return true; } catch (_e) { return false; }
    }
    function safeRemove(key) {
      try { window.localStorage.removeItem(key); } catch (_e) {}
    }

    function storageBridge() {
      if (window.__ZO2Y_AUTH_STORAGE_BRIDGE) return window.__ZO2Y_AUTH_STORAGE_BRIDGE;
      window.__ZO2Y_AUTH_STORAGE_BRIDGE = {
        getItem: function (key) {
          var k = String(key || '');
          if (k === STORAGE_KEY || k === LEGACY_KEY || k === SDK_KEY || k === PERSIST_KEY) k = STORAGE_KEY;
          if (k === DURABLE_KEY) k = DURABLE_KEY;
          return safeGet(k);
        },
        setItem: function (key, value) {
          var k = String(key || '');
          if (k === STORAGE_KEY || k === LEGACY_KEY || k === SDK_KEY || k === PERSIST_KEY) k = STORAGE_KEY;
          return safeSet(k, value);
        },
        removeItem: function (key) {
          var k = String(key || '');
          if (k === STORAGE_KEY || k === LEGACY_KEY || k === SDK_KEY || k === PERSIST_KEY) k = STORAGE_KEY;
          safeRemove(k);
        }
      };
      return window.__ZO2Y_AUTH_STORAGE_BRIDGE;
    }

    function scanStorage() {
      var box = document.getElementById('storageKeys');
      var keys = [];
      try {
        for (var i = 0; i < window.localStorage.length; i += 1) {
          var name = window.localStorage.key(i);
          if (name && name.indexOf('zo2y') === 0) keys.push(name);
        }
        for (var j = 0; j < window.sessionStorage.length; j += 1) {
          var sname = window.sessionStorage.key(j);
          if (sname && sname.indexOf('zo2y') === 0) keys.push('session:' + sname);
        }
      } catch (_err) {}
      keys.sort();
      if (!keys.length) { box.innerHTML = '<span class="warn">no zo2y* keys found</span>'; return; }
      box.innerHTML = '';
      keys.forEach(function (k) {
        var raw = (k.indexOf('session:') === 0)
          ? (function () { try { return window.sessionStorage.getItem(k.slice(8)); } catch (_e) { return null; } })()
          : safeGet(k);
        var brief = 'empty';
        if (raw) {
          brief = raw.length + ' chars, starts with ' + JSON.stringify(raw.slice(0, 40));
        }
        var div = document.createElement('div');
        div.className = 'row';
        div.innerHTML = '<span class="k">' + k + '</span><span class="v">' + brief + '</span>';
        box.appendChild(div);
      });
    }

    function summarizeSession(session) {
      if (!session) return 'NO SESSION';
      return {
        userId: session.user ? session.user.id : null,
        email: session.user ? session.user.email : null,
        hasAccess: !!session.access_token,
        hasRefresh: !!session.refresh_token,
        expiresAt: session.expires_at || null,
        now: Math.floor(Date.now() / 1000)
      };
    }

    async function runRestore() {
      var status = document.getElementById('restoreStatus');
      var details = document.getElementById('restoreDetails');
      details.innerHTML = '';
      status.className = 'big-status warn';
      status.textContent = 'running…';

      var t0 = performance.now();
      log('getSession() start');
      if (!window.supabase || typeof window.supabase.createClient !== 'function') {
        status.className = 'big-status bad';
        status.textContent = 'FAILED: window.supabase not loaded';
        log('FAILED: window.supabase missing');
        return;
      }
      var client;
      try {
        client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
          auth: {
            storage: storageBridge(),
            storageKey: STORAGE_KEY,
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: false,
            flowType: 'implicit'
          }
        });
        log('createClient ok');
      } catch (e) {
        status.className = 'big-status bad';
        status.textContent = 'FAILED: createClient threw';
        log('FAILED createClient: ' + e.message);
        return;
      }

      var authEvt = document.getElementById('authEvents');
      authEvt.innerHTML = '';
      try {
        client.auth.onAuthStateChange(function (event, session) {
          var div = document.createElement('div');
          div.className = 'row';
          var info = session ? (session.user ? session.user.email || session.user.id : 'session') : 'no session';
          div.innerHTML = '<span class="k">' + event + '</span><span class="v">' + info + '</span>';
          authEvt.appendChild(div);
          log('onAuthStateChange ' + event + ' session=' + !!session);
        });
      } catch (e) {
        log('onAuthStateChange threw: ' + e.message);
      }

      var result;
      try {
        result = await client.auth.getSession();
      } catch (e) {
        status.className = 'big-status bad';
        status.textContent = 'FAILED: getSession threw';
        log('FAILED getSession threw: ' + e.message);
        return;
      }
      var elapsed = Math.round((performance.now() - t0) * 10) / 10;
      var session = result && result.data ? result.data.session : null;
      log('getSession() returned in ' + elapsed + 'ms session=' + !!session);

      if (session && session.access_token) {
        status.className = 'big-status ok';
        status.textContent = 'RESTORED (' + elapsed + 'ms) — ' + (session.user ? session.user.email || session.user.id : 'user') ;
      } else {
        status.className = 'big-status bad';
        status.textContent = 'NO SESSION (' + elapsed + 'ms)' + (result && result.error ? ' — error: ' + (result.error.message || '') : '');
      }
      var s = summarizeSession(session);
      details.innerHTML = '';
      Object.keys(s).forEach(function (k) {
        var div = document.createElement('div');
        div.className = 'row';
        var v = s[k];
        var cls = (k === 'hasAccess' && !v) || (k === 'hasRefresh' && !v) ? 'bad' : '';
        div.innerHTML = '<span class="k">' + k + '</span><span class="v ' + cls + '">' + String(v) + '</span>';
        details.appendChild(div);
      });
    }

    document.addEventListener('DOMContentLoaded', function () {
      document.addEventListener('click', function (e) {
        var btn = e.target.closest('[data-act]');
        if (!btn) return;
        var act = btn.getAttribute('data-act');
        if (act === 'run') runRestore();
        if (act === 'storage') scanStorage();
      });
      scanStorage();
      log('debug-auth.html booted');
      runRestore();
    });
  })();
  </script>
</body>
</html>
