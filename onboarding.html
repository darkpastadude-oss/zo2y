  <style>
    :root {
      --bg: #071226;
      --bg-alt: #0b1633;
      --surface: rgba(10, 22, 51, 0.88);
      --surface-strong: rgba(14, 28, 62, 0.96);
      --border: rgba(193, 206, 255, 0.14);
      --border-strong: rgba(193, 206, 255, 0.22);
      --text: #f7f9ff;
      --muted: rgba(224, 232, 255, 0.7);
      --accent: #ffb23f;
      --accent-strong: #ff8c42;
      --error: #f04438;
      --success: #12b76a;
      --shadow: 0 28px 70px rgba(0, 0, 0, 0.34);
    }
    * { box-sizing: border-box; margin: 0; }
    html, body {
      min-height: 100%;
      min-height: 100dvh;
    }
    body {
      margin: 0;
      font-family: "Manrope", system-ui, sans-serif;
      color: var(--text);
      background-color: var(--bg-alt);
      background-image:
        radial-gradient(circle at top left, rgba(255, 178, 63, 0.14), transparent 24rem),
        radial-gradient(circle at top right, rgba(67, 111, 255, 0.16), transparent 26rem),
        linear-gradient(180deg, var(--bg) 0%, var(--bg-alt) 100%);
      background-repeat: no-repeat;
      display: grid;
      place-items: center;
      padding: 28px 18px;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 30px 30px;
      opacity: 0.18;
      pointer-events: none;
    }

    .shell {
      position: relative;
      z-index: 1;
      width: min(100%, 460px);
      margin: auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: "Space Grotesk", sans-serif;
      font-weight: 700;
      font-size: 20px;
      letter-spacing: -0.03em;
      color: var(--text);
      text-decoration: none;
    }
    .brand img {
      width: 40px;
      height: 40px;
      object-fit: contain;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.04);
    }
    .signout {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 9px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.04);
      color: var(--muted);
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: border-color 160ms ease, color 160ms ease;
    }
    .signout:hover {
      border-color: var(--border-strong);
      color: var(--text);
    }

    .card {
      border: 1px solid var(--border);
      border-radius: 24px;
      background: linear-gradient(180deg, rgba(15, 30, 66, 0.94), rgba(8, 18, 42, 0.98));
      box-shadow: var(--shadow);
      padding: 32px 30px 28px;
    }

    .heading {
      text-align: center;
      margin-bottom: 28px;
    }
    .heading h1 {
      font-family: "Space Grotesk", sans-serif;
      font-size: clamp(1.6rem, 3vw, 2rem);
      font-weight: 700;
      letter-spacing: -0.05em;
      line-height: 1.1;
      margin: 0 0 10px;
    }
    .heading p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .field {
      margin-bottom: 4px;
    }
    .field-label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .input-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .input {
      flex: 1;
      height: 54px;
      min-width: 0;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      padding: 0 16px;
      font: inherit;
      font-size: 16px;
      outline: none;
      transition: border-color 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }
    .input::placeholder { color: rgba(224, 232, 255, 0.42); }
    .input:focus,
    .input:focus-visible {
      border-color: rgba(255, 178, 63, 0.74);
      background: rgba(255, 255, 255, 0.06);
      box-shadow: 0 0 0 4px rgba(255, 178, 63, 0.1);
    }
    .hint {
      margin: 10px 2px 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .btn {
      height: 54px;
      min-width: 120px;
      padding: 0 22px;
      border-radius: 14px;
      border: 0;
      background: linear-gradient(135deg, #ffc760 0%, var(--accent-strong) 100%);
      color: #09142c;
      font: inherit;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      white-space: nowrap;
      box-shadow: 0 18px 34px rgba(255, 140, 66, 0.22);
      transition: transform 160ms ease, box-shadow 160ms ease, opacity 160ms ease;
    }
    .btn:not(:disabled):hover {
      transform: translateY(-1px);
      box-shadow: 0 22px 38px rgba(255, 140, 66, 0.28);
    }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .skip {
      display: block;
      margin: 18px auto 0;
      border: 0;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      padding: 6px 10px;
      transition: color 160ms ease;
    }
    .skip:hover { color: var(--accent); }

    .status {
      min-height: 20px;
      margin: 14px 0 0;
      font-size: 13px;
      text-align: center;
      font-weight: 600;
      line-height: 1.4;
    }
    .status.error { color: #ffb4b4; }
    .status.success { color: #b9ffe4; }

    @media (max-width: 480px) {
      body { padding: max(18px, env(safe-area-inset-top)) 14px max(18px, env(safe-area-inset-bottom)); }
      .card { padding: 26px 20px 24px; border-radius: 20px; }
      .input-wrap { flex-direction: column; align-items: stretch; }
      .btn { width: 100%; }
    }

    @media (prefers-reduced-motion: no-preference) {
      .card { animation: cardIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) both; }
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(14px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
  </style>

<body>
  <div class="shell">
    <div class="topbar">
      <a class="brand" href="index.html" aria-label="Zo2y home">
        <img src="/newlogo.webp" alt="" />
        <span>zo2y</span>
      </a>
      <button class="signout" id="signOutBtn" type="button" aria-label="sign out">
        <i class="fas fa-right-from-bracket"></i>
        <span>sign out</span>
      </button>
    </div>

    <section class="card">
      <div class="heading">
        <h1>pick your username</h1>
        <p>This is how you&rsquo;ll appear across Zo2y. Make it yours.</p>
      </div>

      <div class="field">
        <label class="field-label" for="usernameInput">username</label>
        <div class="input-wrap">
          <input id="usernameInput" class="input" type="text" autocomplete="username" autocapitalize="off" spellcheck="false"
            placeholder="your username" maxlength="30" aria-label="username" />
          <button id="saveBtn" class="btn" type="button">
            <span>continue</span>
            <i class="fas fa-arrow-right"></i>
          </button>
        </div>
        <p class="hint">3&ndash;30 letters, numbers, or underscores. No spaces.</p>
      </div>

      <div id="status" class="status"></div>

      <button class="skip" id="skipBtn" type="button">skip for now</button>
    </section>
  </div>
