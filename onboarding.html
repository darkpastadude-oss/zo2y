  <style>
    :root {
      --bg: #0b1633;
      --card: #132347;
      --muted: #8ca3c7;
      --accent: #f59e0b;
      --white: #fff;
      --border: rgba(255,255,255,.12);
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      margin: 0;
      font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background: var(--bg);
      color: var(--white);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }
    body::before {
      content: "";
      position: fixed;
      inset: -25% 0 0 0;
      background: radial-gradient(circle at 50% 0%, rgba(245,158,11,.14), transparent 62%);
      pointer-events: none;
      z-index: -1;
    }

    .wizard-card {
      width: min(480px, 100%);
      background: rgba(19,35,71,.88);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,.4);
      padding: 28px 24px 24px;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 18px;
      letter-spacing: -.03em;
    }
    .brand img {
      width: 32px; height: 32px;
      border-radius: 10px;
      background: #0f1f40;
    }
    .signout {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.1);
      background: rgba(255,255,255,.04);
      color: #d7e7ff;
      font-size: 13px;
      cursor: pointer;
    }
    .signout:hover { border-color: rgba(245,158,11,.4); color: var(--accent); }

    .step-title {
      font-size: 22px;
      font-weight: 700;
      text-align: center;
      letter-spacing: -.03em;
      margin-bottom: 6px;
    }
    .step-sub {
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .input-wrap {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .input {
      flex: 1;
      height: 52px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.12);
      background: #0e1e3d;
      color: #fff;
      padding: 0 16px;
      outline: none;
      font-size: 16px;
    }
    .input:focus {
      border-color: rgba(245,158,11,.55);
      box-shadow: 0 0 0 3px rgba(245,158,11,.12);
    }

    .btn {
      height: 52px;
      padding: 0 22px;
      border-radius: 14px;
      border: 0;
      background: linear-gradient(135deg,#f59e0b 0%,#ffb84d 100%);
      color: #0b1633;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      white-space: nowrap;
      touch-action: manipulation;
    }
    .btn:disabled { opacity: .5; cursor: not-allowed; }

    .hint {
      margin-top: 10px;
      font-size: 13px;
      color: var(--muted);
      text-align: center;
    }

    .status {
      min-height: 20px;
      margin-top: 14px;
      font-size: 13px;
      text-align: center;
      font-weight: 500;
    }
    .status.error { color: #ffb4b4; }
    .status.success { color: #b9ffe4; }

    @media (max-width: 480px) {
      .wizard-card { padding: 20px 16px; }
      .input-wrap { flex-direction: column; }
      .input-wrap .btn { width: 100%; }
    }

    @media (prefers-reduced-motion: no-preference) {
      .wizard-card { animation: cardIn .5s cubic-bezier(.16,1,.3,1) both; }
      .btn { transition: transform .15s, box-shadow .15s; }
      .btn:not(:disabled):hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(245,158,11,.25); }
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(14px) scale(.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
  </style>

<body>
  <div class="wizard-card">
    <div class="top">
      <div class="brand">
        <img src="/file.svg" alt="" />
        <span>zo2y</span>
      </div>
      <button class="signout" id="signOutBtn" type="button" aria-label="sign out">
        <i class="fas fa-right-from-bracket"></i>
        <span>sign out</span>
      </button>
    </div>

    <!-- Single Step: Pick Username -->
    <div class="step-pane active" id="step1">
      <div class="step-title">pick your username</div>
      <div class="step-sub">This is how you&rsquo;ll appear across Zo2y. Make it yours.</div>

      <div class="input-wrap">
        <input id="usernameInput" class="input" type="text" autocomplete="username" autocapitalize="off" spellcheck="false"
          placeholder="your username" maxlength="30" aria-label="username" />
        <button id="saveBtn" class="btn" type="button">
          <span>continue</span>
          <i class="fas fa-arrow-right"></i>
        </button>
      </div>
      <div class="hint">3&ndash;30 letters, numbers, or underscores. No spaces.</div>
      <div id="status" class="status"></div>
    </div>
  </div>
